[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specguard-ai"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = ["pypdf==7.1.1", "markdown-it-py==3.0.0"]

[project.scripts]
specguard = "specguard:main"

[tool.setuptools]
py-modules = ["specguard", "quality", "reporting", "assessment", "comparison"]
